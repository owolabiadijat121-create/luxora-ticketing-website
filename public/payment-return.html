<!doctype html><html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Luxora payment</title><body style="background:#100604;color:#fff4e6;font:16px Arial;padding:35px"><h1>Luxora Residences</h1><h2 id="h">Checking payment…</h2><p id="m">Please wait.</p><script>const ref=new URLSearchParams(location.search).get('reference');fetch('/api/payment-status?reference='+encodeURIComponent(ref||'')).then(r=>r.json()).then(d=>{document.getElementById('h').textContent=d.status==='paid'?'Payment confirmed':'Payment not yet confirmed';document.getElementById('m').textContent=d.status==='paid'?'Your QR ticket has been emailed. Check your inbox and spam folder.':(d.message||'Contact Luxora with your payment reference.')}).catch(()=>{document.getElementById('h').textContent='We are checking your payment';document.getElementById('m').textContent='Contact Luxora with your Paystack reference.'})</script></body></html>
